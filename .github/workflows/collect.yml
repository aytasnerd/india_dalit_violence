name: Collect news

# Runs twice a day: RSS feeds only keep the last day or two of stories,
# so a missed run means stories are lost for good.
on:
  schedule:
    - cron: "17 1,13 * * *" # 06:47 and 18:47 IST
  workflow_dispatch:
    inputs:
      dalit_times_pages:
        description: "Max Dalit Times pages to read (use ~40 to backfill)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Collect
        env:
          PAGES: ${{ inputs.dalit_times_pages || '3' }}
        run: python -m tracker collect --dalit-times-pages "$PAGES"

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.csv data/collection_log.csv
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            NEW=$(tail -n 1 data/collection_log.csv | cut -d, -f6)
            git commit -m "Collect news: ${NEW} new articles"
            git pull --rebase
            git push
          fi
