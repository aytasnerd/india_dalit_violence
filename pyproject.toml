[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-dalit-violence-tracker"
version = "0.1.0"
description = "Collects news reports of violence against Dalit, Bahujan and Adivasi communities in India."
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tracker = "tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
